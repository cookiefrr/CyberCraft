name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: chmod +x gradlew
      - run: ./gradlew --no-daemon runData
      - run: git diff --exit-code -- src/generated/resources
      - run: ./gradlew --no-daemon build runGameTestServer
      - run: xvfb-run -a ./gradlew --no-daemon runClientSmoke
